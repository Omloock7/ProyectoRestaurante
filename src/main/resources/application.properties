spring.application.name=restaurante

# Conexión a MySQL (lee las variables de entorno del IDE)
spring.datasource.url=jdbc:mysql://localhost:3306/sabor_urbano_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Puerto del servidor
server.port=8080