<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"></head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">
                <i class="bi bi-shop me-2"></i>Sabor Urbano
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-house-door me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-gear me-1"></i>Administración
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="pages/categorias.html">Categorías</a></li>
                            <li><a class="dropdown-item" href="pages/productos.html">Productos (Menú)</a></li>
                            <li><a class="dropdown-item" href="pages/cliente.html">Clientes</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/pedidos-lista.html"><i class="bi bi-receipt me-1"></i>Pedidos</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-warning btn-sm fw-semibold mt-1" href="pages/pedidos-form.html">
                            <i class="bi bi-plus-circle me-1"></i>Nuevo Pedido
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
  <div class="container my-4">
    <div class="row g-4">

      <!-- Formulario Registrar / Editar Cliente -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-dark text-white fw-bold">
            <i class="bi bi-person-plus me-2"></i>
            <span th:text="${cliente.id == null} ? 'Registrar Cliente' : 'Editar Cliente'">Registrar Cliente</span>
          </div>
          <div class="card-body">
            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
              <input type="hidden" th:field="*{id}">

              <div class="mb-2">
                <label class="form-label">Identificacion *</label>
                <input type="text" th:field="*{identificacion}" class="form-control"
                       th:classappend="${#fields.hasErrors('identificacion')} ? 'is-invalid'"
                       required placeholder="Ej: 10203040">
                <div class="invalid-feedback" th:errors="*{identificacion}"></div>
              </div>

              <div class="mb-2">
                <label class="form-label">Nombre completo *</label>
                <input type="text" th:field="*{nombre}" class="form-control"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                       required placeholder="Ej: Juan Pérez">
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
              </div>

              <div class="mb-2">
                <label class="form-label">Telefono *</label>
                <input type="tel" th:field="*{telefono}" class="form-control"
                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                       required placeholder="Ej: 3001234567">
                <div class="invalid-feedback" th:errors="*{telefono}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Correo electronico *</label>
                <input type="email" th:field="*{correo}" class="form-control"
                       th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
                       required placeholder="Ej: juan@correo.com">
                <div class="invalid-feedback" th:errors="*{correo}"></div>
              </div>

              <button type="submit" class="btn btn-warning w-100 fw-bold">
                <i class="bi bi-save me-1"></i>Guardar Cliente
              </button>
              <a th:if="${cliente.id != null}" th:href="@{/clientes}"
                 class="btn btn-outline-secondary w-100 mt-2">Cancelar edicion</a>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabla de Clientes -->
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span class="fw-bold"><i class="bi bi-people me-2"></i>Clientes Registrados</span>
            <input type="text" class="form-control form-control-sm w-50"
                   data-filtro-tabla="tablaClientes" placeholder="Buscar por nombre o identificacion...">
          </div>
          <div class="card-body table-responsive">
            <table class="table table-hover align-middle" id="tablaClientes">
              <thead class="table-light">
                <tr>
                  <th>Identificacion</th>
                  <th>Nombre</th>
                  <th>Telefono</th>
                  <th>Correo</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c : ${clientes}">
                  <td th:text="${c.identificacion}"></td>
                  <td class="fw-semibold" th:text="${c.nombre}"></td>
                  <td th:text="${c.telefono}"></td>
                  <td th:text="${c.correo}"></td>
                  <td class="text-center">
                    <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">
                      <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Seguro que deseas eliminar este cliente?');">
                      <i class="bi bi-trash"></i>
                    </a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                  <td colspan="5" class="text-center text-muted py-4">Aun no hay clientes registrados.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
