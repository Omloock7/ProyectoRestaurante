<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

 <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">
                <i class="bi bi-shop me-2"></i>Sabor Urbano
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-house-door me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-gear me-1"></i>Administración
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="pages/categorias.html">Categorías</a></li>
                            <li><a class="dropdown-item" href="pages/productos.html">Productos (Menú)</a></li>
                            <li><a class="dropdown-item" href="pages/cliente.html">Clientes</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/pedidos-lista.html"><i class="bi bi-receipt me-1"></i>Pedidos</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-warning btn-sm fw-semibold mt-1" href="pages/pedidos-form.html">
                            <i class="bi bi-plus-circle me-1"></i>Nuevo Pedido
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
    <div class="container my-4">
        <div class="row g-4">
            <!-- Formulario Crear / Editar Producto -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">Registro de Producto</div>
                    <div class="card-body">
                        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-2">
                                <label class="form-label">Codigo *</label>
                                <input type="text" th:field="*{codigo}" class="form-control" required placeholder="Ej: PROD-01">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Nombre *</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Hamburguesa">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Descripcion</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Categoria *</label>
                                <select th:field="*{categoria}" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio (COP) *</label>
                                <input type="number" th:field="*{precio}" class="form-control" min="1" step="100" required>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" th:field="*{disponible}" id="checkDisponible">
                                <label class="form-check-label fw-semibold" for="checkDisponible">Disponible para la venta</label>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Productos y Buscador (HU02) -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Catalogo Actual</span>
                        <input type="text" id="buscadorProducto" class="form-control form-control-sm w-50" placeholder="Buscar producto o categoria...">
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-hover align-middle" id="tablaProductos">
                            <thead class="table-light">
                                <tr>
                                    <th>Codigo</th>
                                    <th>Producto</th>
                                    <th>Categoria</th>
                                    <th>Precio</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${productos}">
                                    <td th:text="${p.codigo}"></td>
                                    <td>
                                        <strong th:text="${p.nombre}"></strong><br>
                                        <small class="text-muted" th:text="${p.descripcion}"></small>
                                    </td>
                                    <td th:text="${p.categoria.nombre}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'COMMA')}"></td>
                                    <td>
                                        <span th:if="${p.disponible}" class="badge bg-success">Disponible</span>
                                        <span th:unless="${p.disponible}" class="badge bg-danger">Agotado</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                        <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" 
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('¿Seguro que deseas eliminar este producto?');">
                                           <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>

    
</body>
</html>
