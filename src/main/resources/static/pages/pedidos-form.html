<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUEVO PEDIDO</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
</head>
<body>
     <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">
                <i class="bi bi-shop me-2"></i>Sabor Urbano
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-house-door me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-gear me-1"></i>Administración
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="pages/categorias.html">Categorías</a></li>
                            <li><a class="dropdown-item" href="pages/productos.html">Productos (Menú)</a></li>
                            <li><a class="dropdown-item" href="pages/cliente.html">Clientes</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/pedidos-lista.html"><i class="bi bi-receipt me-1"></i>Pedidos</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-warning btn-sm fw-semibold mt-1" href="pages/pedidos-form.html">
                            <i class="bi bi-plus-circle me-1"></i>Nuevo Pedido
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-4 flex-grow-1">
        <form id="formPedido" th:action="@{/pedidos/guardar}" method="post">
            <div class="row g-4">
                <!-- Columna Izquierda: Selección de Cliente y Productos -->
                <div class="col-lg-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-dark text-white fw-bold">
                            <i class="bi bi-person-check me-2"></i>1. Datos de la Orden
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="clienteSelect" class="form-label fw-semibold">Cliente *</label>
                                <select id="clienteSelect" name="clienteId" class="form-select" required>
                                    <option value="">Seleccione un cliente...</option>
                                    <option th:each="c : ${clientes}" 
                                            th:value="${c.id}" 
                                            th:text="${c.identificacion} + ' - ' + ${c.nombre}">
                                    </option>
                                </select>
                            </div>

                            <hr>
                            <h6 class="fw-bold mb-3">2. Agregar Producto al Pedido</h6>
                            <div class="mb-3">
                                <label for="productoSelect" class="form-label">Producto disponible</label>
                                <select id="productoSelect" class="form-select">
                                    <option value="" data-precio="0">Seleccione producto...</option>
                                    <option th:each="p : ${productosDisponibles}" 
                                            th:value="${p.id}" 
                                            th:data-nombre="${p.nombre}" 
                                            th:data-precio="${p.precio}"
                                            th:text="${p.nombre} + ' - $' + ${#numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'COMMA')}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="cantidadInput" class="form-label">Cantidad</label>
                                <input type="number" id="cantidadInput" class="form-control" value="1" min="1">
                            </div>

                            <button type="button" id="btnAgregar" class="btn btn-warning w-100 fw-bold">
                                <i class="bi bi-plus-lg me-1"></i>Agregar al Pedido
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Detalle Dinámico -->
                <div class="col-lg-7">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-list-check me-2"></i>Detalle del Pedido</span>
                            <span class="badge bg-warning text-dark">Estado inicial: Pendiente</span>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="tablaDetalle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Producto</th>
                                            <th class="text-end">Precio Unit.</th>
                                            <th class="text-center">Cant.</th>
                                            <th class="text-end">Subtotal</th>
                                            <th class="text-center">Quitar</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Filas generadas por pedidos.js -->
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-flex justify-content-end align-items-center mt-3 pt-3 border-top">
                                <h4 class="mb-0 me-3">Total:</h4>
                                <h3 class="mb-0 fw-bold text-success" id="totalPedido">$ 0</h3>
                            </div>

                            <div class="mt-4 d-flex justify-content-between">
                                <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success btn-lg px-4">
                                    <i class="bi bi-check-circle me-2"></i>Confirmar Pedido
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
