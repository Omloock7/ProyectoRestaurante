<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATEGORIAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">
                <i class="bi bi-shop me-2"></i>Sabor Urbano
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-house-door me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-gear me-1"></i>Administración
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="categorias.html">Categorías</a></li>
                            <li><a class="dropdown-item" href="productos.html">Productos (Menú)</a></li>
                            <li><a class="dropdown-item" href="cliente">Clientes</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pedidos-lista"><i class="bi bi-receipt me-1"></i>Pedidos</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-warning btn-sm fw-semibold mt-1" th:href="@{/pedidos/nuevo}">
                            <i class="bi bi-plus-circle me-1"></i>Nuevo Pedidos
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

        <!-- Alertas de éxito o error -->
    <div class="container mt-3">
      <div
        th:if="${exito}"
        class="alert alert-success alert-dismissible fade show"
        role="alert"
      >
        <i class="bi bi-check-circle-fill me-2"></i
        ><span th:text="${exito}"></span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
      <div
        th:if="${error}"
        class="alert alert-danger alert-dismissible fade show"
        role="alert"
      >
        <i class="bi bi-exclamation-triangle-fill me-2"></i
        ><span th:text="${error}"></span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
    </div>
    
    <main class="container my-4 flex-grow-1">
        <div class="row g-4">
            <!-- Formulario Crear / Editar Categoría -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="bi bi-tags me-2"></i>Registro de Categoría
                    </div>
                    <div class="card-body">
                        <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Código *</label>
                                <input type="text" th:field="*{codigo}" class="form-control" required placeholder="Ej: CAT-01">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre *</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Platos fuertes">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Breve descripción de la categoría..."></textarea>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" th:field="*{estado}" id="checkEstado">
                                <label class="form-check-label fw-semibold" for="checkEstado">Categoría Activa</label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-warning fw-bold">
                                    <i class="bi bi-save me-1"></i>Guardar Categoría
                                </button>
                                <a th:href="@{/categorias}" class="btn btn-outline-secondary btn-sm">Limpiar / Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Listado de Categorías -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Categorías Registradas</span>
                        <input type="text" id="buscadorCategoria" class="form-control form-control-sm w-50" placeholder="Filtrar categoría...">
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-hover align-middle" id="tablaCategorias">
                            <thead class="table-light">
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th class="text-center">Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categorias}">
                                    <td class="fw-semibold" th:text="${cat.codigo}"></td>
                                    <td th:text="${cat.nombre}"></td>
                                    <td class="text-muted small" th:text="${cat.descripcion}"></td>
                                    <td class="text-center">
                                        <span th:if="${cat.estado}" class="badge bg-success">Activa</span>
                                        <span th:unless="${cat.estado}" class="badge bg-secondary">Inactiva</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/categorias/editar/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/categorias/eliminar/{id}(id=${cat.id})}" 
                                           class="btn btn-sm btn-outline-danger" title="Eliminar/Desactivar"
                                           onclick="return confirm('¿Deseas eliminar o desactivar esta categoría?');">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(categorias)}">
                                    <td colspan="5" class="text-center text-muted py-4">No hay categorías registradas aún.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Filtro rápido para la tabla de categorías
        document.getElementById("buscadorCategoria")?.addEventListener("keyup", function () {
            const filtro = this.value.toLowerCase();
            document.querySelectorAll("#tablaCategorias tbody tr").forEach(fila => {
                fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? "" : "none";
            });
        });
    </script>
</body>
</html>
